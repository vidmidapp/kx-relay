name: ci
on:
  schedule:
    - cron: '0 15,18,21 * * 3'
    - cron: '10 0 * * 4,5'
  push:
    branches: [main]
    paths: ['q/*/b.bin']
  workflow_dispatch:
    inputs:
      m: { type: choice, options: ['1', '2', '3', '4'], default: '1' }
      n: { required: false, default: '' }
      d: { required: false, default: '' }
      r: { type: boolean, default: true }
      s: { type: boolean, default: true }
      u: { required: false, default: '' }
permissions: { contents: write, actions: read }
concurrency: { group: p, cancel-in-progress: false }
env:
  K: ${{ secrets.S2 }}
jobs:
  a:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 15,18,21 * * 3') || (github.event_name == 'workflow_dispatch' && inputs.m == '1' && inputs.u == '')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs: { shards: "${{ steps.x.outputs.shards }}", skip: "${{ steps.x.outputs.skip }}" }
    steps:
      - uses: actions/checkout@v4
      - id: x
        run: |
          mkdir -p "$RUNNER_TEMP/w" && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in c0 | tar xz -C "$RUNNER_TEMP/w"
          bash "$RUNNER_TEMP/w/x.sh" p "${{ inputs.n }}" "${{ inputs.d }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: la, path: '${{ runner.temp }}/o/l.bin', retention-days: 2, if-no-files-found: ignore }
      - if: steps.x.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with: { name: s, path: '${{ runner.temp }}/o/s.bin', retention-days: 2 }
      - if: steps.x.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with: { name: w, path: '${{ runner.temp }}/o/w.bin', retention-days: 3 }
  b:
    needs: a
    if: needs.a.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: { i: "${{ fromJSON(needs.a.outputs.shards) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: s, path: '${{ runner.temp }}/in' }
      - run: |
          mkdir -p "$RUNNER_TEMP/w" && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in c0 | tar xz -C "$RUNNER_TEMP/w"
          bash "$RUNNER_TEMP/w/x.sh" s ${{ matrix.i }}
      - uses: actions/upload-artifact@v4
        with: { name: 'o${{ matrix.i }}', path: '${{ runner.temp }}/o/o${{ matrix.i }}.bin', retention-days: 3 }
  c:
    needs: [a, b]
    if: always() && ((needs.a.result == 'success' && needs.b.result == 'success' && needs.a.outputs.skip == 'false') || (github.event_name == 'workflow_dispatch' && inputs.m == '1' && inputs.u != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: w, path: '${{ runner.temp }}/in', run-id: '${{ inputs.u || github.run_id }}', github-token: '${{ github.token }}' }
      - uses: actions/download-artifact@v4
        with: { pattern: 'o*', path: '${{ runner.temp }}/in', merge-multiple: true, run-id: '${{ inputs.u || github.run_id }}', github-token: '${{ github.token }}' }
      - env: { HSK: "${{ secrets.S3 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/w" && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in c0 | tar xz -C "$RUNNER_TEMP/w"
          bash "$RUNNER_TEMP/w/x.sh" f "${{ (github.event_name == 'workflow_dispatch' && !inputs.s) && '1' || '0' }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: lc, path: '${{ runner.temp }}/o/l.bin', retention-days: 2, if-no-files-found: ignore }
  d:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.m == '2')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - env: { T: "${{ secrets.S1 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/w" && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in c0 | tar xz -C "$RUNNER_TEMP/w"
          bash "$RUNNER_TEMP/w/x.sh" t "${{ inputs.n }}" "${{ (github.event_name == 'workflow_dispatch' && inputs.r) && 'true' || 'false' }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: ld, path: '${{ runner.temp }}/o/l.bin', retention-days: 2, if-no-files-found: ignore }
  e:
    if: (github.event_name == 'schedule' && github.event.schedule == '10 0 * * 4,5') || (github.event_name == 'workflow_dispatch' && (inputs.m == '3' || inputs.m == '4'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - env: { HSK: "${{ secrets.S3 }}" }
        run: |
          mkdir -p "$RUNNER_TEMP/w" && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:K -in c0 | tar xz -C "$RUNNER_TEMP/w"
          bash "$RUNNER_TEMP/w/x.sh" ${{ (github.event_name == 'workflow_dispatch' && inputs.m == '4') && 'k' || 'h' }} "${{ inputs.n }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: le, path: '${{ runner.temp }}/o/l.bin', retention-days: 2, if-no-files-found: ignore }
